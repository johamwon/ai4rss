name: river_platform
description: Flutter platform-channel adapters for River.
publish_to: none
version: 0.1.0
resolution: workspace
environment:
  sdk: '>=3.6.0 <4.0.0'
dependencies:
  # Vendored 11.0.2 keeps its path-traversal fix and iOS 13 support while
  # applying the upstream AGP 9 legacy-KGP compatibility patch.
  file_picker:
    path: ../../third_party/file_picker
  flutter:
    sdk: flutter
  river_domain:
    path: ../river_domain
  river_feed:
    path: ../river_feed
dev_dependencies:
  flutter_test:
    sdk: flutter
