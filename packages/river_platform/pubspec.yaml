name: river_platform
description: Flutter platform-channel adapters for River.
publish_to: none
version: 0.1.0
resolution: workspace
environment:
  sdk: '>=3.6.0 <4.0.0'
dependencies:
  audio_service: 0.18.19
  audio_session: 0.2.4
  connectivity_plus: 7.3.1
  crypto: 3.0.7
  # Vendored 11.0.2 keeps its path-traversal fix and iOS 13 support while
  # applying the upstream AGP 9 legacy-KGP compatibility patch.
  file_picker:
    path: ../../third_party/file_picker
  flutter:
    sdk: flutter
  flutter_secure_storage: 10.3.1
  flutter_tts: 4.2.5
  # 6.2 beta platform packages include AGP 9 and Visual Studio 18 fixes that
  # have not been released on the 21-month-old stable channel.
  flutter_inappwebview: 6.2.0-beta.3
  just_audio: 0.10.6
  just_audio_windows: 0.2.3
  path_provider: 2.1.6
  river_domain:
    path: ../river_domain
  river_feed:
    path: ../river_feed
  river_knowledge:
    path: ../river_knowledge
  river_sync:
    path: ../river_sync
  share_plus: 12.0.2
  url_launcher: 6.3.2
  workmanager: 0.9.0+3
dev_dependencies:
  flutter_test:
    sdk: flutter
