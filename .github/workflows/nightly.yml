name: Nightly

on:
  schedule:
    - cron: '23 18 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  quality:
    name: Deterministic regression
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Run deterministic regression
        run: dart run tool/ci.dart fast

  platform-build:
    name: ${{ matrix.target }} release candidate
    needs: quality
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: android
            os: ubuntu-latest
            command: flutter build appbundle --release
            artifact: apps/river_app/build/app/outputs/bundle/release/app-release.aab
          - target: ios
            os: macos-latest
            command: flutter build ios --release --no-codesign
            artifact: apps/river_app/build/ios/iphoneos/Runner.app
          - target: windows
            os: windows-latest
            command: flutter build windows --release
            artifact: apps/river_app/build/windows/x64/runner/Release
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Set up NuGet for WebView2
        if: matrix.target == 'windows'
        uses: NuGet/setup-nuget@v2

      - name: Resolve workspace
        run: flutter pub get

      - name: Run Windows integration journey
        if: matrix.target == 'windows'
        run: |
          flutter test integration_test/foundation_journey_test.dart -d windows
          flutter test integration_test/dynamic_page_renderer_test.dart -d windows
        working-directory: apps/river_app

      - name: Build ${{ matrix.target }}
        run: ${{ matrix.command }}
        working-directory: apps/river_app

      - name: Upload ${{ matrix.target }} candidate
        uses: actions/upload-artifact@v7
        with:
          name: nightly-${{ matrix.target }}-${{ github.run_number }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 14
